<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemicio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
        }

        .intro {
            text-align: center;
            padding: 2rem;
        }

        .intro p {
            font-size: 1.4rem;
            line-height: 1.8;
            letter-spacing: 0.02em;
        }

        .name {
            color: #ffffff;
            font-weight: bold;
        }

        .nickname {
            color: #ffffff;
            font-weight: bold;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="intro">
        <p>my name is <span class="name">mustafa gemicio</span> but everybody calls me <span class="nickname">gemicio</span></p>
    </div>
</body>
</html>
